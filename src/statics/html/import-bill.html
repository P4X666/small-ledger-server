<!-- 导入账单 -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导入账单</title>
    <link rel="stylesheet" href="../css/import-bill.css">
</head>
<body>
    <div class="container">
        <h1>导入账单</h1>
        <p class="subtitle">上传Excel、CSV或ZIP文件来导入您的账单数据</p>

        <div class="main-content">
            <!-- 账单获取指引卡片 -->
            <div class="guide-container">
                <div class="guide-card">
                    <h2 class="guide-title">📋 账单获取指引</h2>
                    
                    <!-- 支付宝账单 -->
                    <div class="guide-section">
                        <h3 class="guide-subtitle">💳 支付宝账单</h3>
                        <a href="https://consumeprod.alipay.com/record/standard.htm" target="_blank" class="guide-link">
                            前往支付宝账单页面
                        </a>
                    </div>
                    
                    <!-- 微信账单 -->
                    <div class="guide-section">
                        <h3 class="guide-subtitle">💬 微信账单</h3>
                        <ol class="guide-steps">
                            <li class="guide-step">打开微信 APP</li>
                            <li class="guide-step">点击右下角「我」</li>
                            <li class="guide-step">选择「服务」</li>
                            <li class="guide-step">进入「钱包」</li>
                            <li class="guide-step">点击右上角「账单」</li>
                            <li class="guide-step">点击右上角「常见问题」</li>
                            <li class="guide-step">选择「下载账单」</li>
                            <li class="guide-step">勾选「用于个人对账」</li>
                            <li class="guide-step">点击「下载」</li>
                        </ol>
                    </div>
                </div>
            </div>

            <!-- 上传模块 -->
            <div class="upload-container">
                <!-- 消息提示 -->
                <div id="message" class="message"></div>

                <!-- 文件上传区域 -->
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <p class="upload-text">点击或拖拽文件到此处上传</p>
                    <p class="upload-hint">支持 .xlsx 和 .zip 文件格式</p>
                    <input type="file" id="billFile" accept=".zip,.xlsx">
                </div>

                <!-- 已选择文件显示 -->
                <div id="fileInfo" class="file-info">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-size" id="fileSize"></div>
                    <div class="file-actions">
                        <button class="delete-btn" id="deleteBtn">删除</button>
                    </div>
                </div>

                <!-- 进度条 -->
                <div id="progressContainer" class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="button-group">
                    <button id="cancelBtn" class="btn btn-secondary" style="display: none;">取消</button>
                    <button id="uploadBtn" class="btn btn-primary" disabled>上传文件</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const billFile = document.getElementById('billFile');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const deleteBtn = document.getElementById('deleteBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const message = document.getElementById('message');

        // 全局变量
        let selectedFile = null;
        let uploadAbortController = null;

        // 获取链接后缀的token
        function getTokenFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('token');
        }

        // 显示消息
        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type === 'error' ? 'message-error' : 'message-success'} show`;
            
            // 3秒后自动隐藏成功消息
            if (type === 'success') {
                setTimeout(() => {
                    message.classList.remove('show');
                }, 3000);
            }
        }

        // 隐藏消息
        function hideMessage() {
            message.classList.remove('show');
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            else if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
            else return (bytes / 1048576).toFixed(2) + ' MB';
        }

        // 处理文件选择
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                fileName.textContent = file.name;
                fileSize.textContent = `文件大小: ${formatFileSize(file.size)}`;
                fileInfo.classList.add('show');
                uploadBtn.disabled = false;
                hideMessage();
            }
        }

        // 处理拖拽事件
        function handleDragOver(e) {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const file = e.dataTransfer.files[0];
            if (file) {
                // 直接调用文件选择处理函数
                handleFileSelect({ target: { files: [file] } });
            }
        }

        // 处理文件上传
        async function handleUpload() {
            if (!selectedFile) return;

            const token = getTokenFromUrl();
            if (!token) {
                showMessage('错误: 缺少认证token', 'error');
                return;
            }

            try {
                // 显示进度条
                progressContainer.classList.add('show');
                uploadBtn.disabled = true;
                cancelBtn.style.display = 'inline-block';

                // 创建AbortController用于取消上传
                uploadAbortController = new AbortController();

                // 构建FormData
                const formData = new FormData();
                formData.append('file', selectedFile);

                // 发送请求
                const response = await fetch('/excel/upload', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    signal: uploadAbortController.signal
                });

                // 检查响应状态
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || `上传失败: ${response.status}`);
                }

                const data = await response.json();
                showMessage(data.message || '文件上传成功，正在处理中', 'success');
                
                // 处理完成后，清除文件选择
                selectedFile = null;
                fileName.textContent = '';
                fileSize.textContent = '';
                fileInfo.classList.remove('show');
                uploadBtn.disabled = true;
            } catch (error) {
                if (error.name !== 'AbortError') {
                    showMessage(`错误: ${error.message}`, 'error');
                }
                uploadBtn.disabled = false;
            } finally {
                // 重置状态
                progressContainer.classList.remove('show');
                cancelBtn.style.display = 'none';
                uploadAbortController = null;
            }
        }

        // 取消上传
        function handleCancel() {
            if (uploadAbortController) {
                uploadAbortController.abort();
                showMessage('上传已取消', 'error');
            }
            
            // 重置状态
            progressContainer.classList.remove('show');
            cancelBtn.style.display = 'none';
            uploadBtn.disabled = false;
            
            // 清除文件选择
            clearFileSelection();
        }

        // 清除文件选择
        function clearFileSelection() {
            selectedFile = null;
            fileName.textContent = '';
            fileSize.textContent = '';
            fileInfo.classList.remove('show');
            uploadBtn.disabled = true;
            // 重置文件输入控件，以便可以重新选择同一个文件
            billFile.value = '';
        }

        // 处理文件删除
        function handleDelete() {
            clearFileSelection();
            hideMessage();
        }

        // 事件监听
        billFile.addEventListener('change', handleFileSelect);
        uploadBtn.addEventListener('click', handleUpload);
        cancelBtn.addEventListener('click', handleCancel);
        deleteBtn.addEventListener('click', handleDelete);
        
        // 拖拽事件
        uploadArea.addEventListener('dragover', handleDragOver);
        uploadArea.addEventListener('dragleave', handleDragLeave);
        uploadArea.addEventListener('drop', handleDrop);

        // 初始化检查token
        window.addEventListener('load', function() {
            const token = getTokenFromUrl();
            if (!token) {
                showMessage('警告: 未检测到认证token，上传可能会失败', 'error');
            }
        });
    </script>
</body>
</html>
